let ACCENT="blue-green";
const LG=(i,k)=>(LOGOS[k||ACCENT]||LOGOS["blue-green"])[i];
const DESIG=["Managing Partner","Partner","Director","Senior Manager","Audit Manager","Manager","Assistant Manager","Senior Executive","Executive","Article Assistant","Audit Assistant","Paid Assistant","Accountant","Admin Staff","Office Staff"];
const DAYN=[[1,"Mon"],[2,"Tue"],[3,"Wed"],[4,"Thu"],[5,"Fri"],[6,"Sat"]];
const ACC={"blue-green":["Blue & green (default)","#1f6fc9"],red:["Red","#d11a1a"],green:["Green","#1f9d3a"],blue:["Blue","#1f4fd8"],teal:["Teal","#0e9aa0"],pink:["Pink","#d6246e"],purple:["Purple","#6b21c0"],black:["Black","#1a1a1a"],gray:["Grey","#555a60"],gold:["Gold","#b8860b"],maroon:["Maroon","#8f0324"],navy:["Navy","#0b2a7a"],deepteal:["Deep teal","#02545f"]};
const DRV_ERR={denied:"access was not granted",state:"the sign-in link was invalid or already used",expired:"the sign-in took too long, please retry",forbidden:"only the Managing Partner can connect Drive",exchange:"Google did not accept the authorisation",norefresh:"Google did not issue offline access; remove WorkTrack at myaccount.google.com/permissions and retry",scope:"the Drive permission was not ticked on Google's screen",verify:"the folders could not be verified after creation",account:"a different Google account was used; this firm’s records live in the first account, so reconnect with that same account",server:"a server error occurred (check that the Google OAuth secrets are configured)"};
const wt={live:false,user:null,profile:null,firm:null,hier:[],users:[],usersLoaded:0};
const uuid=()=>crypto.randomUUID();
function pwTog(b){const i=b.parentNode.querySelector("input"),show=i.type=="password";i.type=show?"text":"password";b.textContent=show?"Hide":"Show";b.setAttribute("aria-pressed",show)}
const pwBox=(inp)=>`<span class="pwrap">${inp}<button type="button" class="pwt" onclick="pwTog(this)" aria-label="Show or hide password" aria-pressed="false">Show</button></span>`;
const $id=i=>document.getElementById(i);
const ok_email=e=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e);
function applyAccent(k){if(!ACC[k])k="blue-green";ACCENT=k;document.documentElement.style.setProperty("--gold",ACC[k][1]);let l=document.querySelector("link[rel=icon]");if(!l){l=document.createElement("link");l.rel="icon";document.head.appendChild(l)}l.href=LG(1);refreshBrand()}
function refreshBrand(){if(!(wt.live&&wt.firm))return;const b=$id("brand");if(b)b.innerHTML=`<img src="${LG(1)}" alt="" style="height:30px;vertical-align:middle;margin-right:8px">${esc(wt.firm.name)}<small>WorkTrack · FY 2026-27</small>`}
function toast(t,bad){let e=$id("wt-toast");if(!e){e=document.createElement("div");e.id="wt-toast";document.body.appendChild(e)}e.className=bad?"bad":"";e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",bad?8000:3500)}
async function fn(name,body){const {data,error}=await SB.functions.invoke(name,{body});if(error){let m="Request failed. Please try again.";try{const j=await error.context.json();m=j.error||m}catch(_){}return {error:m}}if(data&&data.error)return {error:data.error};return {data}}
const rpcErr=e=>String(e.message||e).replace(/^.*?exception:\s*/i,"")||"Could not save";
function ov(h){const o=$id("wt-ov");o.innerHTML=h;o.style.display="flex";o.scrollTop=0}
function ovHide(){$id("wt-ov").style.display="none"}

/* ---------- sign in ---------- */
function authUI(msg,em){ov(`<div class="wcard narrow"><img class="wlogo" src="${LG(0)}" alt="WorkTrack"><h2>Sign in</h2>${msg?`<div class="err">${esc(msg)}</div>`:""}
<label>Email<input id="a_em" type="email" autocomplete="username" value="${esc(em||"")}"></label><label>Password${pwBox(`<input id="a_pw" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')doSignIn()">`)}</label>
<div class="wrow"><button class="btn" onclick="doSignIn()">Sign in</button><button class="btn ghost" onclick="forgot()">Forgot password</button></div><hr>
<div class="wrow"><button class="btn ghost" onclick="W.step=0;wiz()">Register a new firm</button><button class="btn ghost" onclick="startDemo()">Try with sample data</button></div>
<div class="note">Employees sign in with the email address and password their firm administrator set up. No Google account is needed.</div></div>`)}
async function doSignIn(){const email=a_em.value.trim(),password=a_pw.value;if(!email||!password)return authUI("Enter your email and password.",email);const {data,error}=await SB.auth.signInWithPassword({email,password});if(error)return authUI(/confirm/i.test(error.message)?"Please confirm your email first (check your inbox), then sign in.":"Incorrect email or password.",email);await enter(data.session)}
async function forgot(){const e=a_em.value.trim();if(!ok_email(e))return toast("Enter your email first, then click Forgot password.",1);
 if(Date.now()-forgotAt<60000)return toast("A reset email was just sent. Use the newest email and wait a minute before asking for another.",1);
 forgotAt=Date.now();const {error}=await SB.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname.replace(/index\.html$/,"")});

  if(HS.wiz){if(pw&&!em)return er.textContent="Enter the email this password is for.";if(em&&!(e&&e.email==em&&e.pw&&!pw)&&pw.length<8)return er.textContent="Set a temporary password of at least 8 characters for "+name+"."}}
 if(e){e.name=name;e.designation=des;if(e.parent_id)e.parent_id=par;if(!root&&!locked){if(em)e.email=em;else{delete e.email;delete e.pw}if(HS.wiz&&pw)e.pw=pw}}
 else{const n={id:uuid(),name,designation:des,parent_id:par};if(em){n.email=em;if(HS.wiz)n.pw=pw}HS.nodes.push(n);HS.col[par]=false}
 HS.edit=null;HS.addUnder=null;hRender()}

async function saveFirm(patch,msg){const {error}=await SB.rpc("update_firm_settings",{p_patch:patch});if(error)return toast(rpcErr(error),1);await loadFirm();toast(msg||"Saved");render()}
function sDetails(){const n=$id("s_name").value.trim();if(n.length<2)return toast("Enter the firm name.",1);saveFirm({name:n,address:$id("s_addr").value.trim()},"Firm details saved")}
function sHours(){const o=$id("s_open").value,c=$id("s_close").value,d=DAYN.map(x=>x[0]).filter(x=>$id("s_d"+x).checked);if(!o||!c||o>=c)return toast("Closing time must be after opening time.",1);if(!d.length)return toast("Select at least one working day.",1);saveFirm({work_open:o,work_close:c,work_days:d},"Working hours and days saved")}

async function sHier(){const {error}=await SB.rpc("save_hierarchy",{p_members:HS.nodes.map(n=>({id:n.id,name:n.name,designation:n.designation,parent_id:n.parent_id,email:n.email||null}))});if(error)return toast(rpcErr(error),1);
 const todo=HS.nodes.filter(n=>n.parent_id&&n.email&&!n.user_id);let ok=0;const bad=[];
 for(const n of todo){const r=await fn("create-employee",{action:"provision",member_id:n.id,email:n.email});r.error?bad.push(r.error):ok++}
 await loadHier();HS.init=0;wt.usersLoaded=0;
 toast(bad.length?"Hierarchy saved, but: "+bad.join(" "):ok?"Hierarchy saved. "+ok+" login"+(ok>1?"s":"")+" created. Each person sets a password with “Forgot password” on the sign-in page.":"Hierarchy saved",!!bad.length);render()}

 el.innerHTML=(data&&data.length)?tbl(["When","Type","Result","Size"],data.map(b=>`<tr><td>${new Date(b.created_at).toLocaleString("en-IN")}</td><td>${b.kind}</td><td><span class="pill ${b.status=="verified"?"g":b.status=="failed"?"r":"a"}">${b.status=="verified"?"Verified":b.status=="failed"?"Failed":"Running"}</span>${b.error?` <small>${esc(b.error)}</small>`:""}</td><td>${b.bytes?(b.bytes/1024).toFixed(1)+" KB":"–"}</td></tr>`).join("")):`<div class="note">No backups yet.</div>`}

const MP={};

function mpRender(key){const m=MP[key],root=$id(mpDom(key));if(!root)return;const sel=new Set(m.sel()),q=m.q.trim().toLowerCase();
 root.querySelector(".mpsum").innerHTML=m.summary(key,sel);
 root.querySelector(".mplist").innerHTML=m.master().cats.map(c=>{const act=c.items.filter(i=>i.active);if(!act.length&&!c.items.some(i=>sel.has(i.id)))return "";
  const its=act.filter(i=>!q||(i.name+" "+c.name).toLowerCase().includes(q));if(q&&!its.length)return "";
  const n=act.filter(i=>sel.has(i.id)).length,allOn=its.length>0&&its.every(i=>sel.has(i.id)),some=its.some(i=>sel.has(i.id)),open=q?true:!!m.open[c.id];
  return `<div class="mpc"><div class="mph" data-k="${key}" data-c="${c.id}" onclick="mpOpen(this.dataset.k,this.dataset.c)"><span class="mpa">${open?"▾":"▸"}</span><b>${esc(c.name)}</b><small>${n}/${act.length} selected</small>${m.selAll&&its.length?`<label class="mpall" onclick="event.stopPropagation()"><input type="checkbox" data-ind="${some&&!allOn?1:0}" ${allOn?"checked":""} data-k="${key}" data-c="${c.id}" onchange="mpAll(this.dataset.k,this.dataset.c,this.checked)"> Select all</label>`:""}</div>${open?`<div class="mpb">${its.map(i=>`<label class="mpi"><input type="checkbox" ${sel.has(i.id)?"checked":""} data-k="${key}" data-id="${i.id}" onchange="mpTog(this.dataset.k,this.dataset.id,this.checked)"> <span>${esc(i.name)}</span></label>`).join("")}</div>`:""}</div>`}).join("")||`<div class="note">Nothing matches your search.</div>`;
 root.querySelectorAll("[data-ind='1']").forEach(e=>e.indeterminate=true)}

 const all=c=>c.gmulti?c.gstRows.map(r=>r.gstin):[c.gst].filter(Boolean);
 const rows=CL.list.filter(c=>!q||(c.name+" "+(c.pan||"")+" "+all(c).join(" ")).toLowerCase().includes(q)).map(rowSafe(c=>{const g=all(c),r0=c.gmulti?c.gstRows[0]:c,pp=(CTM[r0.cc]||CTM.IN)[2],cm=(c.gmulti?clAllCmpOf(c):c.cmp).map(cmpName),bz=c.biz?(c.biz.na?"Business: not applicable":(()=>{const it=c.biz.items||[],pr=it.find(x=>x.p)||it[0];return pr?"Business: "+(pr.id?bizName(pr.id):pr.other)+(it.length>1?" (+"+(it.length-1)+" more)":""):""})()):"",inc=(c.gmulti?c.gstRows.flatMap(r=>r.inc):c.incharge).filter((x,i,a)=>a.findIndex(y=>y.id==x.id)==i);
  return `<tr><td class="cl"><b>${esc(c.name)}</b><br><span style="${sub}">${esc(c.type)}</span>${bz?`<br><span style="${sub}">${esc(bz)}</span>`:""}</td><td>${esc(c.pan)||"–"}<br><span style="${sub}">${g.length>1?g.length+" GSTINs":g[0]||"No GSTIN"}</span></td><td>${esc(r0.contact)||"–"}${c.gmulti&&c.gstRows.length>1?` <span style="${sub}">(+${c.gstRows.length-1} more)</span>`:""}<br><span style="${sub}">+${pp} ${esc(r0.ph)}</span></td><td>${cm.map(x=>`<span class="pill" style="margin:0 4px 4px 0">${esc(x)}</span>`).join("")||"–"}</td><td>${esc(inc.map(x=>x.name).join(", "))||"–"}</td>${canAdd?`<td style="white-space:nowrap"><button class="btn ghost sm" onclick="clEdit('${c.id}')">Edit</button> <button class="btn ghost sm" onclick="clDel('${c.id}')">Delete</button></td>`:""}</tr>`})).join("")||`<tr><td colspan="6">${CL.list.length?"No clients match your search.":"No clients yet. Use “Onboard a client” to add the first one."}</td></tr>`;
 const d=CL.d,form=CL.show?`<div class="card" id="clform"><b>${CL.editId?"Edit client":"Onboard a client"}</b>
  <div class="grid" style="margin-top:10px"><label>Client name *<input data-p="name" value="${esc(d.name)}" onchange="clCh('name',this.value)"></label><label>Type<select onchange="clCh('type',this.value)">${CL_TYPES.map(t=>`<option ${t==d.type?"selected":""}>${t}</option>`).join("")}</select></label><label><span id="clpanl">PAN${panReq(d)?" *":" (optional)"}</span><input data-p="pan" value="${esc(d.pan)}" maxlength="10" placeholder="ABCDE1234F" style="text-transform:uppercase" onchange="clCh('pan',this.value)"><span id="clpanh" class="note">${d.country=="IN"?"":"PAN is mandatory only when the client’s country is India."}</span></label></div>
  <div id="clregs" style="margin-top:10px"></div><div id="clbiz"></div><div id="clrest" style="margin-top:6px"></div>
  <div id="clmsg" class="err" style="margin-top:10px">${esc(CL.msg)}</div><div style="margin-top:12px"><button class="btn" id="clsave" onclick="clSave()">${CL.editId?"Save changes":"Add client"}</button> <button class="btn ghost" onclick="clOpen()">Close form</button></div></div>`:"";
 if(CL.show)setTimeout(()=>{clRegs();clBiz();clRest();clPanLbl()},0);
 return `<h1>Clients</h1><div class="sub">${CL.list.length} client${CL.list.length==1?"":"s"}</div><div class="card row"><input id="q" type="search" placeholder="Search by name, PAN or GSTIN" value="${esc(CL.q)}" oninput="clSearch(this.value)" style="flex:1 1 220px">${canAdd?`<button class="btn" onclick="clOpen()">${CL.show?"Close form":"Onboard a client"}</button>`:""}${canAdm?`<button class="btn ghost sm" onclick="meOpen('biz')">Business master</button><button class="btn ghost sm" onclick="meOpen('comp')">Compliance list</button>`:""}</div>${form}${tbl(["Client","PAN / GSTIN","Contact / WhatsApp","Compliances","In-charge"].concat(canAdd?[""]:[]),rows)}`}

/* ---------- My Day (live firm): attendance, appointments timeline, task timer, team ---------- */
const MD={s:null,loaded:0,err:"",busy:0,day:"",chan:null,poll:null,tick:null,showForm:0,form:{id:"",t:"",s:"",e:""},sl:null,tbusy:0,vis:0};
const mdp=n=>String(n).padStart(2,"0");
const lDay=(d=new Date())=>d.getFullYear()+"-"+mdp(d.getMonth()+1)+"-"+mdp(d.getDate());
const lHM=(d=new Date())=>mdp(d.getHours())+":"+mdp(d.getMinutes());
const hmMin=s=>{const [h,m]=String(s).split(":").map(Number);return h*60+m};
const MDW=64; /* pixels per 30-minute slot */
async function mdLoad(){
 MD.busy=1;MD.day=lDay();
 const r=await fn("workday",{action:"state",day:MD.day});
 MD.busy=0;MD.loaded=1;
 if(r.error){MD.err=r.error}else{MD.err="";MD.s=r.data;mdSub()}
 if(cur=="myday")render()}
function mdLive(){
 const p=wt.profile,mp=p.app_role=="managing_partner";
 const head=`<h1>My Day</h1><div class="sub">${esc(p.full_name)} · ${new Date().toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div>`;
 if(!MD.loaded){if(!MD.busy)mdLoad();return head+`<div class="card">Loading your day…</div>`}
 if(MD.err)return head+`<div class="card"><b>My Day could not be loaded</b><div class="sub" style="margin:8px 0">${esc(MD.err)}</div><button class="btn" onclick="MD.loaded=0;render()">Try again</button></div>`;
 const s=MD.s;
 if(!s.drive)return head+`<div class="card"><b>Google Drive must be connected first</b><div class="sub" style="margin:8px 0">${mp?"Attendance, task times and appointments are saved straight into your firm’s Google Drive, so My Day works only once Drive is connected. Once connected it stays connected.":"Attendance, task times and appointments are saved straight into the firm’s Google Drive. Please ask the Managing Partner to connect Drive in Settings."}${s.reason?`<br><br>${esc(s.reason)}`:""}</div>${mp?`<button class="btn" onclick="dConnect()">Connect Google Drive</button>`:""}</div>`;
 const att=s.me.att,rule=mp?"As Managing Partner you can mark attendance from any place. Your current location is recorded.":(s.firm.hasOffice?`You must be within ${s.firm.r} m of the office. Your location is checked when you mark attendance.`:"The Managing Partner has not pinned the office location yet, so attendance cannot be verified.");
 const top=att?"":`<div class="card row"><div><div class="lbl">Attendance</div><div class="big">Not marked yet</div><div class="sub" style="margin:4px 0 0">${rule}</div></div><button class="btn" id="attbtn" onclick="mdAtt()">Mark attendance</button></div>`;
 const tm=s.team&&s.team.lead?`<div id="mdteam">${mdTeamHtml()}</div>`:"";
 const bottom=att?`<div class="card"><b>✔ Attendance marked at ${esc(att.hm)}</b>${att.dist!=null?`<div class="sub" style="margin:4px 0 0">${att.dist} m from the office${att.inside?"":" (outside the geofence)"}</div>`:""}</div>`:"";
 setTimeout(()=>{const e=$id("mdscroll");if(e){e.scrollLeft=MD.sl!=null?MD.sl:Math.max(0,(hmMin(lHM())/30)*MDW-140);e.onscroll=()=>{MD.sl=e.scrollLeft}}},0);
 return head+top+mdTimeline()+mdTimer(att)+tm+bottom}
function mdTimeline(){
 const tl=[...MD.s.me.tl].sort((a,b)=>hmMin(a.s)-hmMin(b.s)),lanes=[];
 const blocks=tl.map(x=>{let l=0;while(lanes[l]!==undefined&&lanes[l]>hmMin(x.s))l++;lanes[l]=hmMin(x.e);return {x,l}});
 const H=30+Math.max(1,lanes.length)*40+8;
 let slots="";for(let i=0;i<48;i++){const m=i%2?"30":"00";slots+=`<div class="mdslot${m=="00"?" h":""}" style="left:${i*MDW}px;width:${MDW}px;height:${H}px" onclick="mdSlot(${i*30})"><span>${m=="00"?mdp(i/2)+":00":m}</span></div>`}
 const bl=blocks.map(({x,l})=>`<div class="mdappt" style="left:${hmMin(x.s)/30*MDW+2}px;width:${Math.max(30,(hmMin(x.e)-hmMin(x.s))/30*MDW-4)}px;top:${30+l*40}px" title="${esc(x.t)} · ${x.s}–${x.e}" onclick="mdEdit('${x.id}')"><b>${esc(x.t)}</b><small>${x.s}–${x.e}</small></div>`).join("");
 const now=`<div class="mdnow" style="left:${hmMin(lHM())/30*MDW}px;height:${H}px"></div>`;
 const f=MD.form,list=tl.map(x=>`<tr><td>${x.s}–${x.e}</td><td>${esc(x.t)}</td><td style="text-align:right"><button class="btn ghost sm" onclick="mdEdit('${x.id}')">Edit</button> <button class="btn ghost sm" onclick="mdDel('${x.id}')">Remove</button></td></tr>`).join("");
 const form=MD.showForm?`<div class="grid" style="margin-top:10px"><label>Appointment / meeting<input id="mdt" maxlength="120" value="${esc(f.t)}" placeholder="e.g. Audit meeting with client"></label><label>From<input id="mds" type="time" value="${f.s}"></label><label>To<input id="mde" type="time" value="${f.e}"></label></div><div class="wrow" style="margin-top:10px"><button class="btn sm" onclick="mdTlSave()">${f.id?"Save changes":"Add to timeline"}</button><button class="btn ghost sm" onclick="MD.showForm=0;render()">Cancel</button></div><div id="mderr" class="err"></div>`:`<div class="wrow" style="margin-top:10px"><button class="btn sm" onclick="mdSlot(Math.ceil(hmMin(lHM())/30)*30)">＋ Add appointment</button></div>`;
 return `<div class="card"><b>Today’s appointments</b><div class="sub" style="margin:4px 0 8px">Each box is 30 minutes. Tap a time to add a meeting there, or tap an appointment to change it.</div><div class="mdscroll" id="mdscroll"><div class="mdtl" style="width:${48*MDW}px;height:${H}px">${slots}${bl}${now}</div></div>${list?`<div class="tbl" style="margin-top:10px"><table>${list}</table></div>`:`<div class="note" style="margin-top:8px">No appointments scheduled today.</div>`}${form}</div>`}
function mdTimer(att){
 const run=MD.s.me.run,locked=!att;
 const cur=run?`<div class="note" style="margin:10px 0;background:var(--blue)"><b>Working on:</b> ${esc(run.t)}${run.c?" · "+esc(run.c):""}${run.k?" · "+esc(run.k):""}<br>Started ${new Date(run.s).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})}${run.day!=MD.day?" (yesterday)":""} · <b id="runel">00:00:00</b> <button class="btn ghost sm" onclick="mdStop()">Stop</button></div>`:"";
 return `<div class="card"><b>⏲ Task timer</b>${cur}<div class="timer"><input id="mdcl" placeholder="Client" maxlength="80"><input id="mdtk" placeholder="Task (e.g. GST return – October)" maxlength="120"><input id="mdwk" placeholder="Work performed (e.g. Vouching)" maxlength="200"><button class="btn" onclick="mdStart()" ${locked?"disabled":""}>${run?"Switch to this task":"Start"}</button></div><div id="tout" class="note">${locked?"Mark your attendance first, then you can start the timer. ":""}Only one timer runs at a time; starting another task stops the current one. There is no cut-off time, so you can keep working past midnight in busy season. Your current task is visible to the people above you in the firm.</div></div>`}
function mdTeamHtml(){
 const t=MD.s.team,day=MD.day,open=n=>(typeof tasks!="undefined"?tasks.filter(x=>x[0]==n&&x[5]!=STAT[4]).length:0);
 const isToday=m=>m.s&&m.s.d==day;
 const working=t.members.filter(m=>m.s&&m.s.w).length;
 const rows=t.members.map((m,i)=>{const s=m.s;let st,c="";
  if(!m.login){st="No login yet";c="color:var(--amb,#b7791f)"}else if(s&&s.w){st="Working";c="color:var(--grn,#1a7f4b);font-weight:600"}else if(isToday(m)&&s.in){st="Present"}else{st="Not started";c="color:var(--mut)"}
  return `<tr><td>${i+1}</td><td><b>${esc(m.name)}</b><br><small style="color:var(--mut)">${esc(m.designation)}</small></td><td style="${c}">${st}</td><td>${isToday(m)&&s.in?s.in+(s.io===0?" (away)":""):"–"}</td><td>${s&&s.w?esc(s.w.t):""}</td><td>${s&&s.w?esc(s.w.c):""}</td><td class="n">${isToday(m)?s.n:0}</td><td class="n">${open(m.name)}</td></tr>`}).join("");
 const names=new Set(t.members.map(m=>m.name)),ot=typeof tasks!="undefined"?tasks.filter(x=>names.has(x[0])&&x[5]!=STAT[4]):[];
 const orows=ot.map((x,i)=>{const late=days(x[4])<0;return `<tr class="${late?"late":""}"><td>${i+1}</td><td>${x[0]}</td><td class="cl">${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td><td class="due ${late?"l":""}">${fmt(x[4])}</td><td><span class="pill ${pc(x[5])}">${x[5]}</span></td><td>${x[6]}</td></tr>`}).join("");
 return `<h2>Team today <small>${working} of ${t.members.length} working</small></h2>${tbl(["","Staff","Today","In","Working on","For","On tasks today","Open tasks"],rows)}<h2>Their open tasks <small>${ot.length}</small></h2>${ot.length?tbl(["","Assigned to","Client","Assignment","Task","Due","Status","Hrs (spent / est.)"],orows):`<div class="card note">No open tasks are assigned to your team yet.</div>`}`}
/* actions: each one is saved to Google Drive and read back by the server before it is shown as done */
async function mdCall(body,btn){
 if(MD.busy)return null;MD.busy=1;if(btn){btn.disabled=true}
 const r=await fn("workday",{day:lDay(),...body});MD.busy=0;if(btn)btn.disabled=false;
 if(r.error){toast(r.error,1);return null}
 if(r.data&&r.data.me)MD.s.me=r.data.me;mdPing();return r.data}
async function mdAtt(){
 const b=$id("attbtn");if(b){b.disabled=true;b.textContent="Getting your location…"}
 const back=()=>{const e=$id("attbtn");if(e){e.disabled=false;e.textContent="Mark attendance"}};
 let pos;
 try{pos=await new Promise((ok,no)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(ok,no,{enableHighAccuracy:true,timeout:20000,maximumAge:0}):no({code:0}))}
 catch(e){back();return toast("Your location is needed to mark attendance. Allow location access for this site in the browser and try again.",1)}
 if(b)b.textContent="Saving to Drive…";MD.busy=0;
 const d=await mdCall({action:"attendance",hm:lHM(),at:new Date().toISOString(),lat:pos.coords.latitude,lng:pos.coords.longitude,acc:pos.coords.accuracy});
 if(!d){back();return}toast("Attendance marked at "+MD.s.me.att.hm);render()}
function mdSlot(min){const a=Math.min(min,23*60+30),e=Math.min(a+30,23*60+59),f=m=>mdp(Math.floor(m/60))+":"+mdp(m%60);MD.form={id:"",t:"",s:f(a),e:f(e)};MD.showForm=1;render();const i=$id("mdt");if(i)i.focus()}
function mdEdit(id){const x=MD.s.me.tl.find(y=>y.id==id);if(!x)return;MD.form={id:x.id,t:x.t,s:x.s,e:x.e};MD.showForm=1;render();const i=$id("mdt");if(i)i.focus()}
async function mdTlSave(){
 const t=$id("mdt").value.trim(),s=$id("mds").value,e=$id("mde").value,er=$id("mderr");
 if(!t)return er.textContent="Enter what the appointment is.";if(!s||!e)return er.textContent="Enter the start and end time.";if(e<=s)return er.textContent="The end time must be after the start time.";
 const id=MD.form.id,items=MD.s.me.tl.filter(x=>x.id!=id).concat([{id:id||uuid(),s,e,t}]);
 const d=await mdCall({action:"timeline_set",items},null);if(d){MD.showForm=0;toast("Appointment saved");render()}}
async function mdDel(id){if(!confirm("Remove this appointment?"))return;const d=await mdCall({action:"timeline_set",items:MD.s.me.tl.filter(x=>x.id!=id)});if(d)render()}
async function mdStart(){
 const cl=$id("mdcl").value.trim(),tk=$id("mdtk").value.trim(),wk=$id("mdwk").value.trim();
 if(!tk)return $id("tout").textContent="Enter the task you are starting.";
 const d=await mdCall({action:"timer_start",client:cl,task:tk,work:wk,at:new Date().toISOString()});if(d){toast("Timer started");render()}}
async function mdStop(){const d=await mdCall({action:"timer_stop",at:new Date().toISOString()});if(d){toast("Timer stopped");render()}}
/* live updates: a ping is broadcast after every save; the team list is also refreshed every few seconds as a fallback */
function mdSub(){
 if(!MD.chan&&wt.firm&&SB.channel){try{MD.chan=SB.channel("wt-day-"+wt.firm.id).on("broadcast",{event:"ping"},()=>mdTeamRefresh()).subscribe()}catch(_){}}
 if(!MD.poll)MD.poll=setInterval(()=>{if(document.hidden)return;if(MD.day&&MD.day!=lDay()){MD.loaded=0;MD.sl=null;if(cur=="myday")render();return}mdTeamRefresh()},8000);
 if(!MD.tick)MD.tick=setInterval(()=>{const e=$id("runel"),r=MD.s&&MD.s.me&&MD.s.me.run;if(e&&r){const x=Math.max(0,Math.floor((Date.now()-Date.parse(r.s))/1000));e.textContent=mdp(Math.floor(x/3600))+":"+mdp(Math.floor(x%3600/60))+":"+mdp(x%60)}},1000);
 if(!MD.vis){MD.vis=1;document.addEventListener("visibilitychange",()=>{if(!document.hidden)mdTeamRefresh()})}}
function mdPing(){try{if(MD.chan)MD.chan.send({type:"broadcast",event:"ping",payload:{}})}catch(_){}}
async function mdTeamRefresh(){
 if(!wt.live||cur!="myday"||!MD.s||!MD.s.drive||!MD.s.team||!MD.s.team.lead||MD.tbusy)return;
 MD.tbusy=1;const r=await fn("workday",{action:"team",day:lDay()});MD.tbusy=0;
 if(r.data&&r.data.team&&r.data.team.lead){MD.s.team=r.data.team;const el=$id("mdteam");if(el)el.innerHTML=mdTeamHtml()}}

async function boot(){
 applyAccent("blue-green");
 SB.auth.onAuthStateChange(ev=>{if(ev==="PASSWORD_RECOVERY"){RECOVERING=true;setTimeout(recoverUI,0)}});
 const EXP="This reset link has expired or was already used. Request a new one with Forgot password, and open only the newest email.";
 const qp=new URLSearchParams(BOOT.q),th=qp.get("token_hash");
 if(th&&qp.get("type")==="recovery"){
  const {error}=await SB.auth.verifyOtp({token_hash:th,type:"recovery"});history.replaceState(null,"",location.pathname);
  if(error)return authUI(EXP);RECOVERING=true;return recoverUI()}
 const {data:{session}}=await SB.auth.getSession();
 if(/type=recovery/.test(BOOT.h)){history.replaceState(null,"",location.pathname);if(!session)return authUI(EXP);RECOVERING=true;return recoverUI()}
 if(/error_code=|error=access_denied/.test(BOOT.h+BOOT.q)){history.replaceState(null,"",location.pathname);return authUI(/otp_expired|expired|invalid/.test(BOOT.h+BOOT.q)?EXP:"That link could not be used. Please try again.")}
 if(RECOVERING)return;
 session?enter(session):authUI()}
boot();

</script>
